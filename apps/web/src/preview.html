<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
    <title>Slopcamera preview</title>
    <meta name="description" content="Slopcamera is a local visual studio for coding agents.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <link rel="canonical" href="https://slopcamera.com/">
    {{PREVIEW_STYLES}}
  </head>
  <body class="preview-route {{PREVIEW_ROUTE_CLASS}}">
    <main aria-labelledby="preview-title" class="preview-shell {{PREVIEW_SHELL_CLASS}}">
      <div aria-hidden="true" class="preview-mark {{PREVIEW_MARK_CLASS}}">
        <span class="preview-mark__sun {{PREVIEW_SUN_CLASS}}"></span>
        <span class="preview-mark__path {{PREVIEW_PATH_CLASS}}"></span>
      </div>
      <p class="preview-kicker {{PREVIEW_KICKER_CLASS}}">a visual studio for coding agents</p>
      <h1 id="preview-title" class="{{PREVIEW_TITLE_CLASS}}">Slopcamera</h1>
      <p class="preview-summary {{PREVIEW_SUMMARY_CLASS}}">Make and edit visual media with your coding agent.</p>
      <ul aria-label="Slopcamera output families" class="preview-outputs {{PREVIEW_OUTPUTS_CLASS}}">
        <li class="{{PREVIEW_FIRST_OUTPUT_CLASS}}"><span class="{{PREVIEW_NUMBER_CLASS}}">01</span>images</li>
        <li class="{{PREVIEW_SECOND_OUTPUT_CLASS}}"><span class="{{PREVIEW_NUMBER_CLASS}}">02</span>diagrams</li>
        <li class="{{PREVIEW_THIRD_OUTPUT_CLASS}}"><span class="{{PREVIEW_NUMBER_CLASS}}">03</span>animated loops</li>
        <li class="{{PREVIEW_FOURTH_OUTPUT_CLASS}}"><span class="{{PREVIEW_NUMBER_CLASS}}">04</span>video</li>
      </ul>
      <p class="preview-note {{PREVIEW_NOTE_CLASS}}">Local tools for generation, editing, motion, and delivery.</p>
    </main>
  </body>
</html>
