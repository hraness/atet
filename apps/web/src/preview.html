<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
    <title>Atet preview</title>
    <meta name="description" content="Atet is an agentic creative coding toolkit for images, diagrams, animated loops, and video.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <link rel="canonical" href="https://atet.sh/">
    <link rel="stylesheet" href="{{CSS_ASSET}}">
  </head>
  <body class="preview-route">
    <main aria-labelledby="preview-title" class="preview-shell">
      <div aria-hidden="true" class="preview-mark">
        <span class="preview-mark__sun"></span>
        <span class="preview-mark__path"></span>
      </div>
      <p class="preview-kicker">agentic creative coding toolkit</p>
      <h1 id="preview-title">Atet</h1>
      <p class="preview-summary">Make and edit visual media with your coding agent.</p>
      <ul aria-label="Atet output families" class="preview-outputs">
        <li><span>01</span>images</li>
        <li><span>02</span>diagrams</li>
        <li><span>03</span>animated loops</li>
        <li><span>04</span>video</li>
      </ul>
      <p class="preview-note">Local tools for generation, editing, motion, and delivery.</p>
    </main>
  </body>
</html>
