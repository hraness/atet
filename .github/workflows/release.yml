            version?.name !== "@hraness/atet"
            || version?.version !== process.env.EXPECTED_VERSION
            || tags?.latest !== process.env.EXPECTED_VERSION
            || dist?.integrity !== process.env.EXPECTED_INTEGRITY
            || !Array.isArray(signatures)
            || signatures.length === 0
            || signatures.length > 10
