name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/atet"
          EXPECTED_REPOSITORY_ID: "1310516748"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      npm_attestation_url: ${{ steps.npm_authority.outputs.npm_attestation_url }}
      npm_integrity: ${{ steps.npm_authority.outputs.npm_integrity }}
      stage_run_attempt: ${{ steps.npm_authority.outputs.stage_run_attempt }}
      stage_run_id: ${{ steps.npm_authority.outputs.stage_run_id }}
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: >-
          npm install --global --ignore-scripts npm@11.19.0
          --registry=https://registry.npmjs.org
      - name: Install FFmpeg
        run: bash scripts/install-ci-ffmpeg.sh
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires a protected owner-created stable tag"
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF" != "refs/tags/$expected_tag" || \
                "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          release_ref="refs/atet-release-tags/$expected_tag"
          git fetch --no-tags origin "refs/tags/$expected_tag:$release_ref"
          if [[ "$(git cat-file -t "$release_ref")" != tag || \
                "$(git rev-parse "$release_ref^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Release requires the exact annotated release tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not newer than $newest_stable_tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify clean source tree
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$source_status" ]]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
      - name: Verify exact public npm artifact
        id: npm_authority
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          archive_name="hraness-atet-$package_version.tgz"
          source_directory="$RUNNER_TEMP/npm-source"
          registry_directory="$RUNNER_TEMP/npm-registry"
          source_metadata="$source_directory/npm-pack.json"
          registry_metadata="$registry_directory/npm-pack.json"
          registry_view="$registry_directory/npm-view.json"
          mkdir -p "$source_directory" "$registry_directory"
          registry_ready=false
          for registry_poll in {1..60}; do
            published_version="$(npm view "$package_name@$package_version" version --json \
              --@hraness:registry=https://registry.npmjs.org \
              --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$published_version" == "\"$package_version\"" ]]; then
              registry_ready=true
              break
            fi
            sleep 10
          done
          if [[ "$registry_ready" != true ]]; then
            echo "::error::$package_name@$package_version did not become readable from npm in time"
            exit 1
          fi
          npm pack --ignore-scripts --json \
            --pack-destination "$source_directory" \
            --registry=https://registry.npmjs.org \
            > "$source_metadata"
          npm pack "$package_name@$package_version" \
            --ignore-scripts --json \
            --pack-destination "$registry_directory" \
            --@hraness:registry=https://registry.npmjs.org \
            --registry=https://registry.npmjs.org \
            > "$registry_metadata"
          npm view "$package_name@$package_version" name version dist dist-tags --json \
            --@hraness:registry=https://registry.npmjs.org \
            --registry=https://registry.npmjs.org \
            > "$registry_view"
          cat "$source_metadata"
          cat "$registry_metadata"
          cat "$registry_view"
          source_archive="$source_directory/$archive_name"
          registry_archive="$registry_directory/$archive_name"
          bun run ./scripts/npm-package-identity.ts \
            "$source_metadata" "$source_archive" \
            "$registry_metadata" "$registry_archive" \
            "$registry_view" \
            "$package_name" "$package_version" "$archive_name"
          bun run ./scripts/package-smoke.ts \
            --archive "$registry_archive" \
            --pack-json "$registry_metadata"
          npm_tool_directory="$RUNNER_TEMP/npm-audit-cli"
          npm_audit_directory="$RUNNER_TEMP/npm-audit-package"
          npm_audit_json="$RUNNER_TEMP/npm-audit-signatures.json"
          npm_authority_receipt="$RUNNER_TEMP/npm-authority-receipt.tsv"
          mkdir -p "$npm_tool_directory" "$npm_audit_directory"
          npm install npm@11.19.0 \
            --prefix "$npm_tool_directory" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --no-save \
            --package-lock=false \
            --registry=https://registry.npmjs.org
          npm_cli="$npm_tool_directory/node_modules/npm/bin/npm-cli.js"
          [[ "$(node "$npm_cli" --version)" == "11.19.0" ]]
          AUDIT_DIRECTORY="$npm_audit_directory" \
            PACKAGE_NAME="$package_name" \
            PACKAGE_VERSION="$package_version" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const manifest = {
            name: "atet-npm-authority-audit",
            private: true,
            dependencies: { [process.env.PACKAGE_NAME]: process.env.PACKAGE_VERSION },
          };
          writeFileSync(`${process.env.AUDIT_DIRECTORY}/package.json`, `${JSON.stringify(manifest)}\n`, { mode: 0o600 });
          NODE
          node "$npm_cli" install \
            --prefix "$npm_audit_directory" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=false \
            --@hraness:registry=https://registry.npmjs.org \
            --registry=https://registry.npmjs.org
          (
            cd "$npm_audit_directory"
            node "$npm_cli" audit signatures \
              --json \
              --include-attestations \
              --omit=dev \
              --@hraness:registry=https://registry.npmjs.org \
              --registry=https://registry.npmjs.org
          ) > "$npm_audit_json"
          bun run ./scripts/npm-publish-authority.ts \
            "$npm_audit_json" "$registry_view" "$registry_archive" \
            "$package_name" "$package_version" "$GITHUB_SHA" \
            > "$npm_authority_receipt"
          IFS=$'\t' read -r stage_run_id stage_run_attempt npm_integrity npm_attestation_url \
            < "$npm_authority_receipt"
          if [[ ! "$stage_run_id" =~ ^[1-9][0-9]*$ || \
                ! "$stage_run_attempt" =~ ^[1-9][0-9]*$ || \
                ! "$npm_integrity" =~ ^sha512-[A-Za-z0-9+/]{86}==$ || \
                "$npm_attestation_url" != "https://registry.npmjs.org/-/npm/v1/attestations/@hraness%2fatet@$package_version" || \
                "$(wc -l < "$npm_authority_receipt" | tr -d ' ')" != 1 ]]; then
            echo "::error::Verified npm provenance did not return one exact stage run attempt"
            exit 1
          fi
          printf 'stage_run_id=%s\nstage_run_attempt=%s\nnpm_integrity=%s\nnpm_attestation_url=%s\n' \
            "$stage_run_id" "$stage_run_attempt" "$npm_integrity" "$npm_attestation_url" \
            >> "$GITHUB_OUTPUT"

  official_vtracer:
    name: Atet VTracer (${{ matrix.target }})
    needs: verify
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: win32-x64
            runner: windows-2025
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:vectorize:official
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}

  native_macos:
    name: Atet macOS shell
    needs: verify
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:desktop:macos
      - run: bun run package:desktop:macos

  publish:
    name: Publish
    needs: [verify, official_vtracer, native_macos]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_NPM_ATTESTATION_URL: ${{ needs.verify.outputs.npm_attestation_url }}
      VERIFIED_NPM_INTEGRITY: ${{ needs.verify.outputs.npm_integrity }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      VERIFIED_STAGE_RUN_ATTEMPT: ${{ needs.verify.outputs.stage_run_attempt }}
      VERIFIED_STAGE_RUN_ID: ${{ needs.verify.outputs.stage_run_id }}
    steps:
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/atet"
          EXPECTED_REPOSITORY_ID: "1310516748"
          EXPECTED_DEFAULT_BRANCH: "main"
          EXPECTED_WORKFLOW_ID: "320001524"
          EXPECTED_WORKFLOW_NAME: "Release"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
          EXPECTED_STAGE_WORKFLOW_ID: "344208600"
          EXPECTED_STAGE_WORKFLOW_NAME: "Stage npm package"
          EXPECTED_STAGE_WORKFLOW_PATH: ".github/workflows/npm-stage.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/atet-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/atet-release-workflow.XXXXXX")"
          stage_attempt_json="$(mktemp "$RUNNER_TEMP/atet-stage-attempt.XXXXXX")"
          stage_workflow_json="$(mktemp "$RUNNER_TEMP/atet-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/atet-release-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_STAGE_RUN_ID/attempts/$VERIFIED_STAGE_RUN_ATTEMPT" \
            > "$stage_attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_STAGE_WORKFLOW_ID" \
            > "$stage_workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            STAGE_ATTEMPT_JSON="$stage_attempt_json" \
            STAGE_WORKFLOW_JSON="$stage_workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$GITHUB_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" \
            EXPECTED_STAGE_RUN_ID="$VERIFIED_STAGE_RUN_ID" \
            EXPECTED_STAGE_RUN_ATTEMPT="$VERIFIED_STAGE_RUN_ATTEMPT" \
            EXPECTED_STAGE_WORKFLOW_ID="$EXPECTED_STAGE_WORKFLOW_ID" \
            EXPECTED_STAGE_WORKFLOW_NAME="$EXPECTED_STAGE_WORKFLOW_NAME" \
            EXPECTED_STAGE_WORKFLOW_PATH="$EXPECTED_STAGE_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const stageAttempt = JSON.parse(readFileSync(process.env.STAGE_ATTEMPT_JSON, "utf8"));
          const stageWorkflow = JSON.parse(readFileSync(process.env.STAGE_WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          const stageRunId = positiveInteger("EXPECTED_STAGE_RUN_ID");
          const stageRunAttempt = positiveInteger("EXPECTED_STAGE_RUN_ATTEMPT");
          const stageWorkflowId = positiveInteger("EXPECTED_STAGE_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== process.env.EXPECTED_DEFAULT_BRANCH
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          if (
            stageAttempt.id !== stageRunId
            || stageAttempt.run_attempt !== stageRunAttempt
            || stageAttempt.workflow_id !== stageWorkflowId
            || stageAttempt.name !== process.env.EXPECTED_STAGE_WORKFLOW_NAME
            || stageAttempt.path !== process.env.EXPECTED_STAGE_WORKFLOW_PATH
            || stageAttempt.event !== "workflow_dispatch"
            || stageAttempt.head_branch !== process.env.EXPECTED_DEFAULT_BRANCH
            || stageAttempt.head_sha !== process.env.EXPECTED_SHA
            || stageAttempt.status !== "completed"
            || stageAttempt.conclusion !== "success"
            || stageAttempt.actor?.id !== actorId
            || stageAttempt.actor?.type !== "User"
            || stageAttempt.triggering_actor?.id !== actorId
            || stageAttempt.triggering_actor?.type !== "User"
            || stageAttempt.repository?.id !== repositoryId
            || stageAttempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || stageAttempt.repository?.private !== false
            || stageWorkflow.id !== stageWorkflowId
            || stageWorkflow.name !== process.env.EXPECTED_STAGE_WORKFLOW_NAME
            || stageWorkflow.path !== process.env.EXPECTED_STAGE_WORKFLOW_PATH
            || stageWorkflow.state !== "active"
          ) throw new Error("Signed npm provenance does not resolve to the owner-authorized successful staging attempt");
          NODE
          current_tag_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$VERIFIED_TAG")"
          current_default_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_DEFAULT_BRANCH")"
          if [[ "$current_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERIFIED_TAG moved to $current_tag_sha after verification"
            exit 1
          fi
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $EXPECTED_DEFAULT_BRANCH"
            exit 1
          fi
      - name: Revalidate live public npm authority
        run: |
          set -euo pipefail
          package_version="${VERIFIED_TAG#v}"
          if [[ "$VERIFIED_TAG" != "v$package_version" || \
                ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                ! "$VERIFIED_NPM_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]{86}==$ || \
                -z "$VERIFIED_NPM_ATTESTATION_URL" ]]; then
            echo "::error::Verified npm authority outputs are malformed"
            exit 1
          fi
          version_view="$(mktemp "$RUNNER_TEMP/atet-live-npm-version.XXXXXX")"
          dist_tags="$(mktemp "$RUNNER_TEMP/atet-live-npm-tags.XXXXXX")"
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            "https://registry.npmjs.org/@hraness%2Fatet/$package_version" \
            > "$version_view"
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            "https://registry.npmjs.org/-/package/@hraness%2Fatet/dist-tags" \
            > "$dist_tags"
          VERSION_VIEW="$version_view" \
            DIST_TAGS="$dist_tags" \
            EXPECTED_ATTESTATION_URL="$VERIFIED_NPM_ATTESTATION_URL" \
            EXPECTED_INTEGRITY="$VERIFIED_NPM_INTEGRITY" \
            EXPECTED_VERSION="$package_version" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const version = JSON.parse(readFileSync(process.env.VERSION_VIEW, "utf8"));
          const tags = JSON.parse(readFileSync(process.env.DIST_TAGS, "utf8"));
          const dist = version?.dist;
          const signatures = dist?.signatures;
          const canonicalBase64 = (value) => {
            if (typeof value !== "string" || value.length === 0 || value.length > 4096
