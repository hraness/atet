name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/atet"
          EXPECTED_REPOSITORY_ID: "1310516748"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      pack_sha256: ${{ steps.pack.outputs.pack_sha256 }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      sums_sha256: ${{ steps.pack.outputs.sums_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_name: ${{ steps.pack.outputs.archive_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Fetch only governed release history
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/atet-release-tags/$GITHUB_REF_NAME"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Authorize exact source and current helper closure
        id: authority
        run: node scripts/github-release.ts authorize "$RUNNER_TEMP"
      - name: Verify release identity
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          [[ "$GITHUB_REF_NAME" == "v$package_version" ]]
          [[ "$(git cat-file -t "refs/atet-release-tags/$GITHUB_REF_NAME")" == tag ]]
          [[ "$(git rev-parse "refs/atet-release-tags/$GITHUB_REF_NAME^{commit}")" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: npm install --global --ignore-scripts npm@11.19.0 --registry=https://registry.npmjs.org
      - name: Install FFmpeg
        run: bash scripts/install-ci-ffmpeg.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify with pinned Node and Chromium
        run: |
          set -euo pipefail
          NODE_EXECUTABLE_PATH="$(command -v node)"
          PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d "$RUNNER_TEMP/atet-playwright.XXXXXX")"
          export NODE_EXECUTABLE_PATH PLAYWRIGHT_BROWSERS_PATH
          playwright_cli="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { dirname, resolve } = require("node:path"); const appRequire = createRequire(resolve("apps/web/package.json")); const manifest = appRequire.resolve("playwright-core/package.json"); console.log(resolve(dirname(manifest), appRequire(manifest).bin["playwright-core"]))')"
          "$NODE_EXECUTABLE_PATH" "$playwright_cli" install --no-shell chromium
          ATET_CHROME_PATH="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { resolve } = require("node:path"); console.log(createRequire(resolve("apps/web/package.json"))("playwright-core").chromium.executablePath())')"
          test -x "$ATET_CHROME_PATH"
          export ATET_CHROME_PATH
          bun run check
      - name: Verify clean source tree
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$source_status" ]]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
      - name: Pack and verify canonical artifact
        id: pack
        env:
          CURRENT_AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/atet-release"
          mkdir "$release_directory"
          npm pack --ignore-scripts --json --pack-destination "$release_directory" --registry=https://registry.npmjs.org > "$release_directory/npm-pack.json"
          package_version="$(node -p 'require("./package.json").version')"
          archive_name="hraness-atet-$package_version.tgz"
          bun run scripts/prepare-github-release.ts "$release_directory"
          bun run scripts/package-smoke.ts --archive "$release_directory/$archive_name" --pack-json "$release_directory/npm-pack.json"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
      - name: Upload verified canonical artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atet-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atet-release
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  official_vtracer:
    name: Atet VTracer (${{ matrix.target }})
    needs: verify
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: win32-x64
            runner: windows-2025
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:vectorize:official
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}

  native_macos:
    name: Atet macOS shell
    needs: verify
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:desktop:macos
      - run: bun run package:desktop:macos

  attest:
    name: Attest canonical artifact
    needs: [verify, official_vtracer, native_macos]
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_PACK_SHA256: ${{ needs.verify.outputs.pack_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      EXPECTED_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Load current release authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          if (e.GITHUB_REPOSITORY !== 'hraness/atet' || e.GITHUB_REPOSITORY_ID !== '1310516748'
            || e.GITHUB_ACTOR_ID !== '894119' || e.GITHUB_EVENT_NAME !== 'push'
            || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(e.GITHUB_REF_NAME ?? '')
            || e.GITHUB_REF !== `refs/tags/${e.GITHUB_REF_NAME}` || !/^[a-f0-9]{40}$/u.test(e.GITHUB_SHA ?? '')) throw new Error('Unexpected release request');
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/hraness/atet/${path}`],
            { encoding: 'utf8', timeout: 30000, killSignal: 'SIGKILL', maxBuffer: 1000000, stdio: ['ignore', 'pipe', 'pipe'] }));
          const run = api(`actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`);
          if (run.id !== Number(e.GITHUB_RUN_ID) || run.run_attempt !== Number(e.GITHUB_RUN_ATTEMPT)
            || run.head_sha !== e.GITHUB_SHA || run.head_branch !== e.GITHUB_REF_NAME || run.event !== 'push'
            || run.workflow_id !== 320001524 || run.path !== '.github/workflows/release.yml'
            || run.actor?.id !== 894119 || run.actor?.type !== 'User' || run.triggering_actor?.id !== 894119 || run.triggering_actor?.type !== 'User'
            || run.repository?.id !== 1310516748 || run.repository?.full_name !== 'hraness/atet' || run.repository?.private !== false
            || run.status !== 'in_progress' || run.conclusion !== null) throw new Error('Untrusted release attempt');
          const main = api('git/ref/heads/main').object;
          if (main?.type !== 'commit' || !/^[a-f0-9]{40}$/u.test(main.sha ?? '')) throw new Error('Invalid current main');
          for (const path of ['.github/workflows/release.yml', 'scripts/github-release.ts', 'scripts/prepare-github-release.ts', 'scripts/package-smoke.ts', 'scripts/npm-package-identity.ts', 'scripts/npm-publish-policy.ts', 'package.json', 'bun.lock']) {
            const decode = ref => {
              const file = api(`contents/${path}?ref=${ref}`);
              if (file.type !== 'file' || file.encoding !== 'base64' || typeof file.content !== 'string' || file.content.length > 300000) throw new Error('Unsafe authority file');
              return Buffer.from(file.content, 'base64');
            };
            const current = decode(main.sha);
            if (!current.equals(decode(e.GITHUB_SHA))) throw new Error(`Current authority changed: ${path}`);
            if (path === 'scripts/github-release.ts') writeFileSync(`${e.RUNNER_TEMP}/github-release.ts`, current, { flag: 'wx', mode: 0o600 });
          }
          NODE
          node "$RUNNER_TEMP/github-release.ts" authorize "$RUNNER_TEMP"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/atet-release
      - name: Rebind verified artifact before OIDC
        run: node "$RUNNER_TEMP/github-release.ts" verify "$RUNNER_TEMP/atet-release"
      - name: Attest exact canonical files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/atet-release/${{ needs.verify.outputs.archive_name }}
            ${{ runner.temp }}/atet-release/npm-pack.json
            ${{ runner.temp }}/atet-release/release-manifest.json
            ${{ runner.temp }}/atet-release/SHA256SUMS
          push-to-registry: false
          create-storage-record: false
      - name: Preserve signed bundle and verify it
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          EXPECT_SIGNED: "true"
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH" && test ! -L "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/atet-release/provenance.jsonl"
          node "$RUNNER_TEMP/github-release.ts" verify "$RUNNER_TEMP/atet-release"
      - name: Upload attested canonical artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atet-attested-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atet-release
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: [verify, official_vtracer, native_macos, attest]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_PACK_SHA256: ${{ needs.verify.outputs.pack_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      EXPECTED_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Load current release authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          if (e.GITHUB_REPOSITORY !== 'hraness/atet' || e.GITHUB_REPOSITORY_ID !== '1310516748'
            || e.GITHUB_ACTOR_ID !== '894119' || e.GITHUB_EVENT_NAME !== 'push'
            || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(e.GITHUB_REF_NAME ?? '')
            || e.GITHUB_REF !== `refs/tags/${e.GITHUB_REF_NAME}` || !/^[a-f0-9]{40}$/u.test(e.GITHUB_SHA ?? '')) throw new Error('Unexpected release request');
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/hraness/atet/${path}`],
            { encoding: 'utf8', timeout: 30000, killSignal: 'SIGKILL', maxBuffer: 1000000, stdio: ['ignore', 'pipe', 'pipe'] }));
          const run = api(`actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`);
          if (run.id !== Number(e.GITHUB_RUN_ID) || run.run_attempt !== Number(e.GITHUB_RUN_ATTEMPT)
            || run.head_sha !== e.GITHUB_SHA || run.head_branch !== e.GITHUB_REF_NAME || run.event !== 'push'
            || run.workflow_id !== 320001524 || run.path !== '.github/workflows/release.yml'
            || run.actor?.id !== 894119 || run.actor?.type !== 'User' || run.triggering_actor?.id !== 894119 || run.triggering_actor?.type !== 'User'
            || run.repository?.id !== 1310516748 || run.repository?.full_name !== 'hraness/atet' || run.repository?.private !== false
            || run.status !== 'in_progress' || run.conclusion !== null) throw new Error('Untrusted release attempt');
          const main = api('git/ref/heads/main').object;
          if (main?.type !== 'commit' || !/^[a-f0-9]{40}$/u.test(main.sha ?? '')) throw new Error('Invalid current main');
          for (const path of ['.github/workflows/release.yml', 'scripts/github-release.ts', 'scripts/prepare-github-release.ts', 'scripts/package-smoke.ts', 'scripts/npm-package-identity.ts', 'scripts/npm-publish-policy.ts', 'package.json', 'bun.lock']) {
            const decode = ref => {
              const file = api(`contents/${path}?ref=${ref}`);
              if (file.type !== 'file' || file.encoding !== 'base64' || typeof file.content !== 'string' || file.content.length > 300000) throw new Error('Unsafe authority file');
              return Buffer.from(file.content, 'base64');
            };
            const current = decode(main.sha);
            if (!current.equals(decode(e.GITHUB_SHA))) throw new Error(`Current authority changed: ${path}`);
            if (path === 'scripts/github-release.ts') writeFileSync(`${e.RUNNER_TEMP}/github-release.ts`, current, { flag: 'wx', mode: 0o600 });
          }
          NODE
          node "$RUNNER_TEMP/github-release.ts" authorize "$RUNNER_TEMP"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/atet-release
      - name: Publish verified immutable GitHub Release
        run: node "$RUNNER_TEMP/github-release.ts" publish "$RUNNER_TEMP/atet-release"
