name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: >-
          npm install --global --ignore-scripts npm@11.19.0
          --registry=https://registry.npmjs.org
      - name: Install FFmpeg
        run: bash scripts/install-ci-ffmpeg.sh
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not newer than $newest_stable_tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify clean source tree
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$source_status" ]]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
      - name: Verify exact public npm artifact
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          archive_name="hraness-atet-$package_version.tgz"
          source_directory="$RUNNER_TEMP/npm-source"
          registry_directory="$RUNNER_TEMP/npm-registry"
          source_metadata="$source_directory/npm-pack.json"
          registry_metadata="$registry_directory/npm-pack.json"
          mkdir -p "$source_directory" "$registry_directory"
          npm pack --ignore-scripts --json \
            --pack-destination "$source_directory" \
            --registry=https://registry.npmjs.org \
            > "$source_metadata"
          npm pack "$package_name@$package_version" \
            --ignore-scripts --json \
            --pack-destination "$registry_directory" \
            --registry=https://registry.npmjs.org \
            > "$registry_metadata"
          cat "$source_metadata"
          cat "$registry_metadata"
          source_archive="$source_directory/$archive_name"
          registry_archive="$registry_directory/$archive_name"
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const [sourceMetadata, registryMetadata, sourceArchive, registryArchive, expectedName, expectedVersion, expectedFilename] = process.argv.slice(1);
            const readResult = (path, label) => {
              const value = JSON.parse(readFileSync(path, "utf8"));
              if (!Array.isArray(value) || value.length !== 1 || typeof value[0] !== "object" || value[0] === null) {
                console.error(`::error::${label} npm pack metadata must contain exactly one package`);
                process.exit(1);
              }
              return value[0];
            };
            const source = readResult(sourceMetadata, "source");
            const registry = readResult(registryMetadata, "registry");
            for (const [label, value] of [["source", source], ["registry", registry]]) {
              if (value.name !== expectedName || value.version !== expectedVersion || value.filename !== expectedFilename) {
                console.error(`::error::${label} npm package identity differs from ${expectedName}@${expectedVersion}`);
                process.exit(1);
              }
              const bytes = readFileSync(label === "source" ? sourceArchive : registryArchive);
              const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
              const shasum = createHash("sha1").update(bytes).digest("hex");
              if (value.size !== bytes.length || value.integrity !== integrity || value.shasum !== shasum) {
                console.error(`::error::${label} npm metadata does not identify its exact archive bytes`);
                process.exit(1);
              }
            }
            for (const field of ["entryCount", "filename", "integrity", "name", "shasum", "size", "unpackedSize"]) {
              if (source[field] !== registry[field]) {
                console.error(`::error::published npm ${field} differs from the checked source artifact`);
                process.exit(1);
              }
            }
            const inventory = value => JSON.stringify(value.files.map(({ mode, path, size }) => ({ mode, path, size })));
            if (!Array.isArray(source.files) || !Array.isArray(registry.files) || inventory(source) !== inventory(registry)) {
              console.error("::error::published npm inventory differs from the checked source artifact");
              process.exit(1);
            }
          ' "$source_metadata" "$registry_metadata" \
            "$source_archive" "$registry_archive" \
            "$package_name" "$package_version" "$archive_name"
          cmp --silent "$source_archive" "$registry_archive"
          sha512sum "$source_archive" "$registry_archive"
          bun run ./scripts/package-smoke.ts \
            --archive "$registry_archive" \
            --pack-json "$registry_metadata"

  official_vtracer:
    name: Atet VTracer (${{ matrix.target }})
    needs: verify
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: win32-x64
            runner: windows-2025
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:vectorize:official
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}

  native_macos:
    name: Atet macOS shell
    needs: verify
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:desktop:macos
      - run: bun run package:desktop:macos

  publish:
    name: Publish
    needs: [verify, official_vtracer, native_macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            published_tags="$(gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
            printf '%s\n' "$published_tags" | NEXT_TAG="$GITHUB_REF_NAME" node -e '
              const fs = require("node:fs");
              const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
              const parse = (tag) => {
                const match = pattern.exec(tag);
                return match === null ? null : match.slice(1).map(BigInt);
              };
              const compare = (left, right) => {
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] !== right[index]) {
                    return left[index] > right[index] ? 1 : -1;
                  }
                }
                return 0;
              };
              const next = parse(process.env.NEXT_TAG ?? "");
              if (next === null) process.exit(1);
              for (const tag of fs.readFileSync(0, "utf8").split(/\r?\n/u)) {
                const current = parse(tag);
                if (current !== null && compare(next, current) <= 0) {
                  console.error("::error::Release " + process.env.NEXT_TAG + " is not newer than " + tag);
                  process.exit(1);
                }
              }
            '
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Atet $GITHUB_REF_NAME"
          fi
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          expected_state="$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t0'
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is not published and immutable"
            exit 1
          fi
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Latest release is $latest_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi
