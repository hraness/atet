          cd "$clean_npm_directory"
          npm stage publish "$TARBALL" \
            --@hraness:registry=https://registry.npmjs.org \
            --access public \
            --globalconfig="$clean_global_config" \
            --ignore-scripts \
            --json \
            --provenance \
            --registry=https://registry.npmjs.org \
            --userconfig="$clean_user_config" \
            > "$stage_result"
          stage_id="$(STAGE_RESULT="$stage_result" EXPECTED_VERSION="$EXPECTED_VERSION" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const output = JSON.parse(readFileSync(process.env.STAGE_RESULT, "utf8"));
          const expectedName = "@hraness/atet";
          const keys = output !== null && typeof output === "object" && !Array.isArray(output)
            ? Object.keys(output)
            : [];
          const result = keys.length === 1 && keys[0] === expectedName
            ? output[expectedName]
            : null;
          if (
            result === null
            || typeof result !== "object"
            || Array.isArray(result)
            || result.name !== expectedName
            || result.version !== process.env.EXPECTED_VERSION
            || typeof result.stageId !== "string"
            || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu.test(result.stageId)
