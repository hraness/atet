name: Stage npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install npm 11.19.0
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ "$(node --version)" == v24.* ]]
      - name: Verify default-branch package identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch this workflow from $DEFAULT_BRANCH"
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$GITHUB_SHA" != "$default_sha" ]]; then
            echo "::error::Dispatch SHA $GITHUB_SHA is not current $DEFAULT_BRANCH HEAD $default_sha"
            exit 1
          fi
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_name" != "@hraness/atet" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semver"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$package_version" >/dev/null; then
            echo "::error::Create v$package_version only after npm delivery is verified"
            exit 1
          fi
          npm view "$package_name" name --json >/dev/null
          set +e
          registry_result="$(npm view "$package_name@$package_version" version --json 2>&1)"
          registry_status=$?
          set -e
          if [[ $registry_status -eq 0 ]]; then
            echo "::error::$package_name@$package_version already exists"
            exit 1
          fi
          if [[ "$registry_result" != *E404* ]]; then
            printf '%s\n' "$registry_result"
            echo "::error::Could not prove that $package_name@$package_version is unused"
            exit 1
          fi
      - name: Install FFmpeg
        run: bash scripts/install-ci-ffmpeg.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify committed generated output
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist apps/desktop/dist/cli bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Pack and verify the exact artifact
        id: pack
        run: |
          set -euo pipefail
          archive_directory="$RUNNER_TEMP/atet-npm"
          mkdir -p "$archive_directory"
          pack_result="$(npm pack --ignore-scripts --json --pack-destination "$archive_directory")"
          archive_name="$(printf '%s' "$pack_result" | node -e '
            const input = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (!Array.isArray(input) || input.length !== 1 || typeof input[0]?.filename !== "string") process.exit(1);
            process.stdout.write(input[0].filename);
          ')"
          archive="$archive_directory/$archive_name"
          bun run ./scripts/package-smoke.ts "$archive"
          sha256sum "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
      - name: Upload reviewed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.archive_name }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
      - name: Stage reviewed package
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          current_default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$GITHUB_SHA" != "$current_default_sha" ]]; then
            echo "::error::Default branch advanced to $current_default_sha after verification; rerun this workflow"
            exit 1
          fi
          npm stage publish "${{ steps.pack.outputs.archive }}" --access public
