name: Stage npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact package
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_version: ${{ steps.pack.outputs.package_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install npm 11.19.0
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0 \
            --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ "$(node --version)" == v24.* ]]
      - name: Verify default-branch package identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch this workflow from $DEFAULT_BRANCH"
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$default_sha" || "$checked_out_sha" != "$default_sha" ]]; then
            echo "::error::Dispatch SHA $GITHUB_SHA is not current $DEFAULT_BRANCH HEAD $default_sha"
            exit 1
          fi
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_name" != "@hraness/atet" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semver"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$package_version" >/dev/null; then
            echo "::error::Create v$package_version only after npm delivery is verified"
            exit 1
          fi
          npm view "$package_name" name --json \
            --registry=https://registry.npmjs.org >/dev/null
          set +e
          registry_result="$(npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org 2>&1)"
          registry_status=$?
          set -e
          if [[ $registry_status -eq 0 ]]; then
            echo "::error::$package_name@$package_version already exists"
            exit 1
          fi
          if [[ "$registry_result" != *E404* ]]; then
            printf '%s\n' "$registry_result"
            echo "::error::Could not prove that $package_name@$package_version is unused"
            exit 1
          fi
          printf 'source_sha=%s\n' "$default_sha" >> "$GITHUB_OUTPUT"
      - name: Install FFmpeg
        run: bash scripts/install-ci-ffmpeg.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify clean source tree
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$source_status" ]]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
      - name: Pack and verify the exact artifact
        id: pack
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/atet-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          metadata="$artifact_directory/npm-pack.json"
          digest="$artifact_directory/npm-package.sha256"
          mkdir -p "$artifact_directory"
          npm pack --ignore-scripts --json \
            --pack-destination "$artifact_directory" \
            --registry=https://registry.npmjs.org \
            > "$metadata"
          cat "$metadata"
          IFS=$'\t' read -r archive_name package_version < <(node -e '
            const input = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(input) || input.length !== 1) process.exit(1);
            const { filename, version } = input[0] ?? {};
            if (typeof filename !== "string" || typeof version !== "string") process.exit(1);
            process.stdout.write(`${filename}\t${version}\n`);
          ' "$metadata")
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$archive_name" != "hraness-atet-$package_version.tgz" ]]; then
            echo "::error::npm pack returned an unsafe filename or version"
            exit 1
          fi
          archive="$artifact_directory/$archive_name"
          bun run ./scripts/package-smoke.ts \
            --archive "$archive" \
            --pack-json "$metadata"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          metadata_sha256="$(sha256sum "$metadata" | cut -d ' ' -f 1)"
          printf '%s  %s\n%s  npm-pack.json\n' \
            "$archive_sha256" "$archive_name" "$metadata_sha256" > "$digest"
          (
            cd "$artifact_directory"
            sha256sum --check npm-package.sha256
          )
          artifact_entry_count="$(ARTIFACT_DIRECTORY="$artifact_directory" node -e '
            const { readdirSync } = require("node:fs");
            process.stdout.write(String(readdirSync(process.env.ARTIFACT_DIRECTORY).length));
          ')"
          if [[ "$artifact_entry_count" != 3 ]]; then
            echo "::error::Reviewed npm artifact must contain exactly three files"
            exit 1
          fi
          for required_file in "$archive" "$metadata" "$digest"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Reviewed npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          artifact_name="npm-package-$package_version-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_directory=%s\nartifact_name=%s\npackage_version=%s\ntarball_name=%s\n' \
            "$artifact_directory" "$artifact_name" "$package_version" "$archive_name" \
            >> "$GITHUB_OUTPUT"
      - name: Upload reviewed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifact_directory }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage exact package
    needs: verify
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Install npm 11.19.0
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0 \
            --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ "$(node --version)" == v24.* ]]
      - name: Bind artifact reference
        env:
          ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package identity is invalid"
            exit 1
          fi
          expected_artifact_name="npm-package-$EXPECTED_VERSION-$EXPECTED_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$ARTIFACT_NAME" != "$expected_artifact_name" ]]; then
            echo "::error::Verified artifact name is not bound to this run and attempt"
            exit 1
          fi
      - name: Download reviewed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/atet-npm-stage
      - name: Rebind downloaded package
        id: artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/atet-npm-stage"
          metadata="$artifact_directory/npm-pack.json"
          digest="$artifact_directory/npm-package.sha256"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Verified source commit is invalid"
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package version is not stable semver"
            exit 1
          fi
          expected_tarball_name="hraness-atet-$EXPECTED_VERSION.tgz"
          if [[ "$EXPECTED_TARBALL_NAME" != "$expected_tarball_name" ]]; then
            echo "::error::Verified tarball name is unsafe or inconsistent"
            exit 1
          fi
          tarball="$artifact_directory/$expected_tarball_name"
          if [[ ! -d "$artifact_directory" || -L "$artifact_directory" ]]; then
            echo "::error::Downloaded npm artifact directory is unsafe"
            exit 1
          fi
          artifact_entry_count="$(ARTIFACT_DIRECTORY="$artifact_directory" node -e '
            const { readdirSync } = require("node:fs");
            process.stdout.write(String(readdirSync(process.env.ARTIFACT_DIRECTORY).length));
          ')"
          if [[ "$artifact_entry_count" != 3 ]]; then
            echo "::error::Downloaded npm artifact must contain exactly the tarball, npm-pack.json, and npm-package.sha256"
            exit 1
          fi
          for required_file in "$tarball" "$metadata" "$digest"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Downloaded npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          rebound_output="$(mktemp "$RUNNER_TEMP/atet-rebound-digests.XXXXXX")"
          DIGEST="$digest" \
            EXPECTED_TARBALL_NAME="$expected_tarball_name" \
            EXPECTED_VERSION="$EXPECTED_VERSION" \
            METADATA="$metadata" \
            TARBALL="$tarball" node > "$rebound_output" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");

          const maximumFiles = 350;
          const maximumMetadataBytes = 1_000_000;
          const maximumPackedBytes = 3_750_000;
          const maximumUnpackedBytes = 8_900_000;
          const expectedName = "@hraness/atet";
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedFilename = process.env.EXPECTED_TARBALL_NAME;
          const tarball = process.env.TARBALL;
          const metadata = process.env.METADATA;
          const digest = process.env.DIGEST;
          if (!expectedVersion || !expectedFilename || !tarball || !metadata || !digest) {
            throw new Error("Downloaded artifact environment is incomplete");
          }

          const archiveInfo = statSync(tarball);
          const metadataInfo = statSync(metadata);
          const digestInfo = statSync(digest);
          if (archiveInfo.size <= 0 || archiveInfo.size > maximumPackedBytes) {
            throw new Error("Downloaded tarball exceeds the reviewed packed-size bound");
          }
          if (metadataInfo.size <= 0 || metadataInfo.size > maximumMetadataBytes) {
            throw new Error("Downloaded npm-pack.json exceeds its reviewed size bound");
          }
          if (digestInfo.size <= 0 || digestInfo.size > 1_024) {
            throw new Error("Downloaded SHA-256 manifest exceeds its reviewed size bound");
          }

          const archiveBytes = readFileSync(tarball);
          const metadataBytes = readFileSync(metadata);
          const digestText = readFileSync(digest, "utf8");
          const archiveSha256 = createHash("sha256").update(archiveBytes).digest("hex");
          const metadataSha256 = createHash("sha256").update(metadataBytes).digest("hex");
          const digestLines = digestText.split("\n");
          if (digestLines.length !== 3 || digestLines[2] !== "") {
            throw new Error("SHA-256 manifest must contain exactly two newline-terminated records");
          }
          const digests = new Map();
          for (const line of digestLines.slice(0, 2)) {
            const match = /^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$/u.exec(line);
            if (!match || digests.has(match[2])) {
              throw new Error("SHA-256 manifest contains an invalid record");
            }
            digests.set(match[2], match[1]);
          }
          if (
            digests.size !== 2 ||
            digests.get(expectedFilename) !== archiveSha256 ||
            digests.get("npm-pack.json") !== metadataSha256
          ) {
            throw new Error("Downloaded files differ from the independent SHA-256 manifest");
          }

          const input = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(metadataBytes));
          if (!Array.isArray(input) || input.length !== 1) {
            throw new Error("npm-pack.json must contain exactly one package");
          }
          const record = input[0];
          if (!record || typeof record !== "object" || Array.isArray(record)) {
            throw new Error("npm-pack.json package record is invalid");
          }
          if (record.name !== expectedName || record.id !== `${expectedName}@${expectedVersion}`) {
            throw new Error("npm-pack.json has the wrong package identity");
          }
          if (record.version !== expectedVersion || record.filename !== expectedFilename) {
            throw new Error("npm-pack.json has the wrong version or tarball filename");
          }
          if (!/^hraness-atet-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.tgz$/u.test(record.filename)) {
            throw new Error("npm-pack.json has an unsafe tarball filename");
          }
          for (const [field, maximum] of [
            ["entryCount", maximumFiles],
            ["size", maximumPackedBytes],
            ["unpackedSize", maximumUnpackedBytes],
          ]) {
            if (!Number.isSafeInteger(record[field]) || record[field] <= 0 || record[field] > maximum) {
              throw new Error(`npm-pack.json has an invalid or excessive ${field}`);
            }
          }
          if (record.size !== archiveBytes.byteLength) {
            throw new Error("Downloaded tarball byte size differs from npm-pack.json");
          }
          if (!Array.isArray(record.files) || record.files.length !== record.entryCount) {
            throw new Error("npm-pack.json has an invalid file inventory count");
          }
          const paths = new Set();
          let unpackedSize = 0;
          for (const file of record.files) {
            if (!file || typeof file !== "object" || Array.isArray(file)) {
              throw new Error("npm-pack.json file inventory contains a non-object");
            }
            if (
              typeof file.path !== "string" ||
              file.path.length === 0 ||
              Buffer.byteLength(file.path, "utf8") > 1_024 ||
              file.path.includes("\\") ||
              file.path.includes("\0") ||
              file.path.startsWith("/") ||
              file.path.split("/").some((part) => part === "" || part === "." || part === "..") ||
              paths.has(file.path)
            ) {
              throw new Error("npm-pack.json file inventory contains an unsafe or duplicate path");
            }
            if (!Number.isSafeInteger(file.size) || file.size < 0) {
              throw new Error("npm-pack.json file inventory contains an invalid size");
            }
            if (file.mode !== 0o644 && file.mode !== 0o755) {
              throw new Error("npm-pack.json file inventory contains an invalid mode");
            }
            paths.add(file.path);
            unpackedSize += file.size;
            if (!Number.isSafeInteger(unpackedSize) || unpackedSize > maximumUnpackedBytes) {
              throw new Error("npm-pack.json file inventory exceeds the reviewed unpacked-size bound");
            }
          }
          if (unpackedSize !== record.unpackedSize) {
            throw new Error("npm-pack.json unpacked size differs from its file inventory");
          }
          for (const requiredPath of [
            "DISCLOSURE",
            "LICENSE",
            "NOTICE.md",
            "README.md",
            "SECURITY.md",
            "apps/desktop/dist/cli/main.js",
            "apps/desktop/dist/cli/NebulaSans-Bold-26se8aek.otf",
            "apps/desktop/dist/cli/NebulaSans-Bold-bcz7y08t.woff2",
            "apps/desktop/dist/cli/NebulaSans-Book-5ax05zvn.woff2",
            "apps/desktop/dist/cli/NebulaSans-Book-8cenzchw.otf",
            "dist/NebulaSans-Bold-26se8aek.otf",
            "dist/NebulaSans-Bold-bcz7y08t.woff2",
            "dist/NebulaSans-Book-5ax05zvn.woff2",
            "dist/NebulaSans-Book-8cenzchw.otf",
            "package.json",
            "skills/atet/SKILL.md",
            "src/assets/fonts/nebula-sans/LICENSE.txt",
            "src/assets/fonts/nebula-sans/NebulaSans-Bold.otf",
            "src/assets/fonts/nebula-sans/NebulaSans-Bold.woff2",
            "src/assets/fonts/nebula-sans/NebulaSans-Book.otf",
            "src/assets/fonts/nebula-sans/NebulaSans-Book.woff2",
            "src/assets/fonts/nebula-sans/PROVENANCE.md",
          ]) {
            if (!paths.has(requiredPath)) {
              throw new Error(`npm-pack.json is missing required package path ${requiredPath}`);
            }
          }
          const integrity = `sha512-${createHash("sha512").update(archiveBytes).digest("base64")}`;
          const shasum = createHash("sha1").update(archiveBytes).digest("hex");
          if (record.integrity !== integrity || record.shasum !== shasum) {
            throw new Error("Downloaded tarball differs from npm-pack.json SHA-1 or SHA-512");
          }
          process.stdout.write(`${archiveSha256} ${metadataSha256}\n`);
          NODE
          read -r rebound_archive_sha256 rebound_metadata_sha256 < "$rebound_output"
          if [[ ! "$rebound_archive_sha256" =~ ^[a-f0-9]{64}$ || \
                ! "$rebound_metadata_sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not preserve rebound package digests"
            exit 1
          fi
          printf 'archive_sha256=%s\nmetadata_sha256=%s\ntarball=%s\n' \
            "$rebound_archive_sha256" "$rebound_metadata_sha256" "$tarball" \
            >> "$GITHUB_OUTPUT"
      - name: Revalidate current main and stage exact package
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ steps.artifact.outputs.metadata_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          current_main="$RUNNER_TEMP/atet-current-main.git"
          git init --quiet --bare "$current_main"
          git --git-dir="$current_main" fetch --quiet --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/$DEFAULT_BRANCH"
          current_default_sha="$(git --git-dir="$current_main" rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || \
                "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$GITHUB_SHA" != "$current_default_sha" ]]; then
            echo "::error::Default branch advanced to $current_default_sha after verification; rerun this workflow"
            exit 1
          fi
          current_archive_sha256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          current_metadata_sha256="$(sha256sum "${TARBALL%/*}/npm-pack.json" | cut -d ' ' -f 1)"
          if [[ "$current_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" || \
                "$current_metadata_sha256" != "$EXPECTED_METADATA_SHA256" ]]; then
            echo "::error::Downloaded package changed after current-main verification"
            exit 1
          fi
          npm stage publish "$TARBALL" \
            --access public \
            --registry=https://registry.npmjs.org
