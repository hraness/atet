name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Exact canonical GitHub version to mirror; defaults to current source version
        required: false
        default: ""
        type: string
      publish_to_npm:
        description: Stage the verified package through npm trusted publishing
        required: false
        default: false
        type: boolean
      resolved_stage_version:
        description: Exact cleared stage-intent version that releases the retained history lock
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact package
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_version: ${{ steps.pack.outputs.package_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      canonical_source_sha: ${{ steps.canonical.outputs.canonical_source_sha }}
      stage_required: ${{ steps.identity.outputs.stage_required }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install npm 11.19.0
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0 \
            --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ "$(node --version)" == v24.* ]]
      - name: Verify default-branch package identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH"
            exit 1
          fi
          git fetch --no-tags --unshallow origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$default_sha" || "$checked_out_sha" != "$default_sha" ]]; then
            echo "::error::Workflow SHA $GITHUB_SHA is not current $DEFAULT_BRANCH HEAD $default_sha"
            exit 1
          fi
          package_name="$(node -p 'require("./package.json").name')"
          package_version="${REQUESTED_VERSION:-$(node -p 'require("./package.json").version')}"
          if [[ "$package_name" != "@hraness/atet" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semver"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::Optional npm mirroring requires an explicit workflow dispatch"
            exit 1
          fi
          printf 'stage_required=true\n' >> "$GITHUB_OUTPUT"
          npm view "$package_name" name --json \
            --@hraness:registry=https://registry.npmjs.org \
            --registry=https://registry.npmjs.org >/dev/null
          set +e
          registry_result="$(npm view "$package_name@$package_version" version --json \
            --@hraness:registry=https://registry.npmjs.org \
            --registry=https://registry.npmjs.org 2>&1)"
          registry_status=$?
          set -e
          if [[ $registry_status -eq 0 ]]; then
            echo "::error::$package_name@$package_version already exists"
            exit 1
          fi
          if [[ "$registry_result" != *E404* ]]; then
            printf '%s\n' "$registry_result"
            echo "::error::Could not prove that $package_name@$package_version is unused"
            exit 1
          fi
          printf 'source_sha=%s\n' "$default_sha" >> "$GITHUB_OUTPUT"
          printf 'package_version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
      - name: Admit canonical archive and isolate its source
        id: canonical
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.package_version }}
        run: |
          set -euo pipefail
          canonical_directory="$RUNNER_TEMP/atet-canonical-mirror"
          mkdir "$canonical_directory"
          node scripts/github-release.ts mirror "$canonical_directory"
          canonical_source_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceSha' "$canonical_directory/release-manifest.json")"
          [[ "$canonical_source_sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$canonical_source_sha" "$GITHUB_SHA"
          source_directory="$RUNNER_TEMP/atet-mirror-source"
          git worktree add --detach "$source_directory" "$canonical_source_sha"
          test "$(git -C "$source_directory" rev-parse HEAD)" = "$canonical_source_sha"
          test "$(cd "$source_directory" && node -p 'require("./package.json").version')" = "$EXPECTED_VERSION"
          printf 'source_directory=%s\n' "$source_directory" >> "$GITHUB_OUTPUT"
      - name: Install FFmpeg
        if: steps.identity.outputs.stage_required == 'true'
        working-directory: ${{ steps.canonical.outputs.source_directory }}
        run: bash scripts/install-ci-ffmpeg.sh
      - if: steps.identity.outputs.stage_required == 'true'
        working-directory: ${{ steps.canonical.outputs.source_directory }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify with pinned Node and Chromium
        if: steps.identity.outputs.stage_required == 'true'
        working-directory: ${{ steps.canonical.outputs.source_directory }}
        run: |
          set -euo pipefail
          NODE_EXECUTABLE_PATH="$(command -v node)"
          PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d "$RUNNER_TEMP/atet-playwright.XXXXXX")"
          export NODE_EXECUTABLE_PATH PLAYWRIGHT_BROWSERS_PATH
          playwright_cli="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { dirname, resolve } = require("node:path"); const appRequire = createRequire(resolve("apps/web/package.json")); const manifest = appRequire.resolve("playwright-core/package.json"); console.log(resolve(dirname(manifest), appRequire(manifest).bin["playwright-core"]))')"
          "$NODE_EXECUTABLE_PATH" "$playwright_cli" install --no-shell chromium
          ATET_CHROME_PATH="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { resolve } = require("node:path"); console.log(createRequire(resolve("apps/web/package.json"))("playwright-core").chromium.executablePath())')"
          test -x "$ATET_CHROME_PATH"
          export ATET_CHROME_PATH
          bun run check
      - name: Verify clean source tree
        if: steps.identity.outputs.stage_required == 'true'
        working-directory: ${{ steps.canonical.outputs.source_directory }}
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$source_status" ]]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
      - name: Pack and verify the exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.canonical.outputs.package_version }}
          SOURCE_DIRECTORY: ${{ steps.canonical.outputs.source_directory }}
        if: steps.identity.outputs.stage_required == 'true'
        id: pack
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/atet-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          metadata="$artifact_directory/npm-pack.json"
          digest="$artifact_directory/npm-package.sha256"
          mkdir -p "$artifact_directory"
          canonical_directory="$RUNNER_TEMP/atet-canonical-mirror"
          node scripts/github-release.ts mirror-verify "$canonical_directory"
          cp "$canonical_directory/npm-pack.json" "$metadata"
          cp "$canonical_directory/hraness-atet-$EXPECTED_VERSION.tgz" "$artifact_directory/"
          cat "$metadata"
          IFS=$'\t' read -r archive_name package_version < <(node -e '
            const input = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(input) || input.length !== 1) process.exit(1);
            const { filename, version } = input[0] ?? {};
            if (typeof filename !== "string" || typeof version !== "string") process.exit(1);
            process.stdout.write(`${filename}\t${version}\n`);
          ' "$metadata")
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$archive_name" != "hraness-atet-$package_version.tgz" ]]; then
            echo "::error::npm pack returned an unsafe filename or version"
            exit 1
          fi
          archive="$artifact_directory/$archive_name"
          (
            cd "$SOURCE_DIRECTORY"
            bun run "$GITHUB_WORKSPACE/scripts/package-smoke.ts" \
              --archive "$archive" \
              --pack-json "$metadata"
          )
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          metadata_sha256="$(sha256sum "$metadata" | cut -d ' ' -f 1)"
          printf '%s  %s\n%s  npm-pack.json\n' \
            "$archive_sha256" "$archive_name" "$metadata_sha256" > "$digest"
          (
            cd "$artifact_directory"
            sha256sum --check npm-package.sha256
          )
          artifact_entry_count="$(ARTIFACT_DIRECTORY="$artifact_directory" node -e '
            const { readdirSync } = require("node:fs");
            process.stdout.write(String(readdirSync(process.env.ARTIFACT_DIRECTORY).length));
          ')"
          if [[ "$artifact_entry_count" != 3 ]]; then
            echo "::error::Reviewed npm artifact must contain exactly three files"
            exit 1
          fi
          for required_file in "$archive" "$metadata" "$digest"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Reviewed npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          artifact_name="npm-package-$package_version-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_directory=%s\nartifact_name=%s\npackage_version=%s\ntarball_name=%s\n' \
            "$artifact_directory" "$artifact_name" "$package_version" "$archive_name" \
            >> "$GITHUB_OUTPUT"
      - name: Upload reviewed package
        if: steps.identity.outputs.stage_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifact_directory }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage exact package v${{ needs.verify.outputs.package_version }}
    needs: verify
    if: needs.verify.outputs.stage_required == 'true' && inputs.publish_to_npm == true
    environment:
      name: npm-stage
    permissions:
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reauthorize exact staging attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/atet"
          EXPECTED_REPOSITORY_ID: "1310516748"
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_WORKFLOW_ID: "344208600"
          EXPECTED_WORKFLOW_NAME: "Stage npm package"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/npm-stage.yml"
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TO_NPM: ${{ inputs.publish_to_npm }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_TO_NPM" != true || \
                "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != refs/heads/main || \
                "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$REF_PROTECTED" != true || \
                ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::npm staging requires the owner-authorized exact protected-main dispatch"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/atet-stage-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/atet-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/atet-stage-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$EXPECTED_SOURCE_SHA" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current npm staging attempt is not owner-authorized for the exact public workflow");
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Install npm 11.19.0
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0 \
            --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ "$(node --version)" == v24.* ]]
      - name: Reject unresolved stable-stage intent
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          EXPECTED_WORKFLOW_ID: "344208600"
          GH_TOKEN: ${{ github.token }}
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          history_npm_directory="$(mktemp -d "$RUNNER_TEMP/atet-stage-history-npm.XXXXXX")"
          history_user_config="$(mktemp "$RUNNER_TEMP/atet-stage-history-user.XXXXXX")"
          history_global_config="$(mktemp "$RUNNER_TEMP/atet-stage-history-global.XXXXXX")"
          chmod 700 "$history_npm_directory"
          chmod 600 "$history_user_config" "$history_global_config"
          cd "$history_npm_directory"
          HISTORY_USER_CONFIG="$history_user_config" \
            HISTORY_GLOBAL_CONFIG="$history_global_config" node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const expectedName = "@hraness/atet";
          const expectedVersion = process.env.EXPECTED_VERSION ?? "";
          const workflowId = process.env.EXPECTED_WORKFLOW_ID ?? "";
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          const currentRunId = process.env.GITHUB_RUN_ID ?? "";
          const resolvedStageVersion = process.env.RESOLVED_STAGE_VERSION ?? "";
          const userConfig = process.env.HISTORY_USER_CONFIG ?? "";
          const globalConfig = process.env.HISTORY_GLOBAL_CONFIG ?? "";
          const maximum = BigInt(Number.MAX_SAFE_INTEGER);
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
          const parseVersion = (value, label) => {
            const match = versionPattern.exec(value);
            if (match === null) throw new Error(`${label} is not a stable semantic version`);
            const parts = match.slice(1).map(BigInt);
            if (parts.some(part => part > maximum)) {
              throw new Error(`${label} exceeds Number.MAX_SAFE_INTEGER`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
            }
            return 0;
          };
          const execute = (command, args, label) => {
            const result = spawnSync(command, args, {
              encoding: "utf8",
              maxBuffer: 10 * 1024 * 1024,
            });
            if (result.status !== 0 || result.error) throw new Error(`Could not read ${label}`);
            return result.stdout;
          };
          const workflowNumber = Number(workflowId);
          const currentRunNumber = Number(currentRunId);
          if (
            !/^[1-9][0-9]*$/u.test(workflowId)
            || !/^[1-9][0-9]*$/u.test(currentRunId)
            || !Number.isSafeInteger(workflowNumber)
            || !Number.isSafeInteger(currentRunNumber)
            || repository !== "hraness/atet"
            || userConfig === ""
            || globalConfig === ""
          ) throw new Error("Stable-stage history identity is invalid");
          const current = parseVersion(expectedVersion, "Candidate version");
          const resolved = resolvedStageVersion === ""
            ? null
            : parseVersion(resolvedStageVersion, "Resolved prior stage version");
          const latestValue = JSON.parse(execute("npm", [
            "view",
            expectedName,
            "dist-tags.latest",
            "--json",
            `--globalconfig=${globalConfig}`,
            "--registry=https://registry.npmjs.org",
            `--userconfig=${userConfig}`,
          ], "npm latest"));
          if (typeof latestValue !== "string") throw new Error("npm latest is not a version string");
          const latest = parseVersion(latestValue, "npm latest");
          if (compare(current, latest) <= 0) {
            throw new Error(`Candidate ${expectedVersion} is not newer than npm latest ${latestValue}`);
          }
          const intentRuns = new Map();
          const resolutionCounts = new Map();
          const increment = (map, version) => map.set(version, (map.get(version) ?? 0) + 1);
          const inspectRunJobs = (runId) => {
            const jobsPayload = JSON.parse(execute("gh", [
              "api",
              "--method", "GET",
              `/repos/${repository}/actions/runs/${runId}/jobs?filter=all&per_page=100`,
            ], `jobs for npm-stage run ${runId}`));
            if (
              !jobsPayload
              || typeof jobsPayload !== "object"
              || !Number.isSafeInteger(jobsPayload.total_count)
              || jobsPayload.total_count < 0
              || jobsPayload.total_count > 100
              || !Array.isArray(jobsPayload.jobs)
              || jobsPayload.jobs.length !== jobsPayload.total_count
            ) throw new Error(`npm-stage run ${runId} exceeds the reviewed 100-job bound`);
            for (const job of jobsPayload.jobs) {
              if (
                !job
                || typeof job !== "object"
                || typeof job.name !== "string"
                || !Array.isArray(job.steps)
                || job.steps.length > 100
              ) throw new Error(`npm-stage run ${runId} contains an invalid job`);
              const intents = job.steps.filter(step => (
                step?.name === "Record exclusive stable-stage intent"
                && step?.conclusion === "success"
              ));
              const resolutions = job.steps.filter(step => (
                typeof step?.name === "string"
                && step.name.startsWith("Record cleared stable-stage intent")
                && step?.conclusion === "success"
              ));
              const terminalWrites = job.steps.filter(step => (
                step?.name === "Revalidate current main and stage exact package"
                && step?.conclusion !== null
                && step?.conclusion !== "skipped"
              ));
              if (intents.length > 1) {
                throw new Error(`npm-stage run ${runId} has ambiguous successful intent steps`);
              }
              if (resolutions.length > 1) {
                throw new Error(`npm-stage run ${runId} has ambiguous successful resolution steps`);
              }
              if (terminalWrites.length > 1 || (terminalWrites.length === 1 && intents.length !== 1)) {
                throw new Error(`npm-stage run ${runId} has a terminal write without one durable intent`);
              }
              if (terminalWrites.length === 1) {
                const intentNumber = intents[0].number;
                const terminalNumber = terminalWrites[0].number;
                if (
                  !Number.isSafeInteger(intentNumber)
                  || intentNumber < 1
                  || !Number.isSafeInteger(terminalNumber)
                  || terminalNumber !== intentNumber + 1
                ) {
                  throw new Error(
                    `npm-stage run ${runId} terminal write is not immediately preceded by its durable intent`,
                  );
                }
              }
              if (intents.length === 0 && resolutions.length === 0) {
                if (job.name.startsWith("Stage exact package") && job.conclusion === "success") {
                  throw new Error(`npm-stage run ${runId} has a successful stage job without a durable intent`);
                }
                continue;
              }
              const match = /^Stage exact package v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/u.exec(job.name);
              if (match === null) {
                throw new Error(`npm-stage run ${runId} lacks a version-bound stage job`);
              }
              if (intents.length === 1) {
                const stagedVersion = match[1];
                parseVersion(stagedVersion, `Staged version from run ${runId}`);
                const runs = intentRuns.get(stagedVersion) ?? [];
                runs.push(runId);
                intentRuns.set(stagedVersion, runs);
              }
              if (resolutions.length === 1) {
                const resolutionMatch = /^Record cleared stable-stage intent v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/u.exec(resolutions[0].name);
                if (resolutionMatch === null) {
                  throw new Error(`npm-stage run ${runId} has an invalid cleared-intent identity`);
                }
                parseVersion(resolutionMatch[1], `Cleared version from run ${runId}`);
                increment(resolutionCounts, resolutionMatch[1]);
              }
            }
          };
          // A rerun changes the current run back to in_progress, so it drops out
          // of the completed-runs query. Inspect all attempts of this run
          // explicitly before scanning earlier completed dispatches.
          inspectRunJobs(currentRunNumber);
          const runsPayload = JSON.parse(execute("gh", [
            "api",
            "--method", "GET",
