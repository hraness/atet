          const requiredNames = [archiveName, 'npm-pack.json', 'release-manifest.json', 'SHA256SUMS', 'provenance.jsonl'];
          const metadata = Array.isArray(assets) ? assets.filter(asset => asset?.name === 'npm-pack.json') : [];
          if (release?.tag_name !== `v${process.env.EXPECTED_VERSION}` || release?.target_commitish !== process.env.EXPECTED_CANONICAL_SOURCE_SHA
            || release?.draft !== false || release?.prerelease !== false || release?.immutable !== true
            || release?.author?.id !== 41898282 || release?.author?.login !== 'github-actions[bot]' || release?.author?.type !== 'Bot'
            || !Number.isSafeInteger(release?.id) || release.id < 1 || !Array.isArray(assets) || assets.length !== 5
            || new Set(assets.map(asset => asset?.id)).size !== 5 || new Set(assets.map(asset => asset?.name)).size !== 5
            || assets.some(asset => !Number.isSafeInteger(asset?.id) || asset.id < 1 || asset.state !== 'uploaded' || !requiredNames.includes(asset.name))
            || matches.length !== 1 || matches[0].digest !== `sha256:${process.env.EXPECTED_ARCHIVE_SHA256}`
            || metadata.length !== 1 || metadata[0].digest !== `sha256:${process.env.EXPECTED_METADATA_SHA256}`) {
