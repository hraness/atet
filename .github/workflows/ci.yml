name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.routes.outputs.desktop }}
      native: ${{ steps.routes.outputs.native }}
      package: ${{ steps.routes.outputs.package }}
      sdk: ${{ steps.routes.outputs.sdk }}
      site: ${{ steps.routes.outputs.site }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route changed paths
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sdk=false
          desktop=false
          native=false
          package=false
          site=false
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            sdk=true
            desktop=true
            native=true
            package=true
            site=true
          else
            while IFS= read -r path; do
              case "$path" in
                .github/*|package.json|bun.lock|tsconfig.json|eslint.config.mjs|scripts/*)
                  sdk=true
                  desktop=true
                  native=true
                  package=true
                  site=true
                  ;;
                src/*|schema/*|examples/*|skills/*|packages/scene/*)
                  sdk=true
                  package=true
                  ;;
                AGENTS.md|CONTRIBUTING.md|NOTICE.md|README.md|SECURITY.md|docs/*)
                  sdk=true
                  package=true
                  ;;
              esac
              case "$path" in
                apps/desktop/*|packages/scene/*)
                  desktop=true
                  native=true
                  package=true
                  ;;
                apps/web/*)
                  site=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          printf 'sdk=%s\ndesktop=%s\nnative=%s\npackage=%s\nsite=%s\n' \
            "$sdk" "$desktop" "$native" "$package" "$site" | tee -a "$GITHUB_OUTPUT"

  boundary:
    name: Atet standalone boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun run check:standalone

  sdk:
    name: Atet SDK
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:standalone
      - run: bun run check:sdk
      - name: Check generated SDK standalone boundary
        run: bun run check:standalone
      - name: Verify committed SDK output
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js","./dist/cli.js","./dist/code/index.js","./dist/code/advanced.js","./dist/generate.js","./dist/host-resources.js","./dist/operations.js","./dist/workflow.js"].map(path => import(path)))'

  desktop:
    name: Atet local runtime
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install FFmpeg
        run: bash scripts/install-ci-ffmpeg.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:desktop
      - name: Check generated desktop standalone boundary
        run: bun run check:standalone
      - name: Verify committed CLI output
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- apps/desktop/dist/cli bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  site:
    name: Atet site
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the site with pinned Node and Chromium
        run: |
          set -euo pipefail
          NODE_EXECUTABLE_PATH="$(command -v node)"
          PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d "$RUNNER_TEMP/atet-playwright.XXXXXX")"
          export NODE_EXECUTABLE_PATH PLAYWRIGHT_BROWSERS_PATH
          playwright_cli="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { dirname, resolve } = require("node:path"); const appRequire = createRequire(resolve("apps/web/package.json")); const manifest = appRequire.resolve("playwright-core/package.json"); console.log(resolve(dirname(manifest), appRequire(manifest).bin["playwright-core"]))')"
          "$NODE_EXECUTABLE_PATH" "$playwright_cli" install --no-shell chromium
          ATET_CHROME_PATH="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { resolve } = require("node:path"); console.log(createRequire(resolve("apps/web/package.json"))("playwright-core").chromium.executablePath())')"
          test -x "$ATET_CHROME_PATH"
          export ATET_CHROME_PATH
          bun run check:web
      - name: Check generated site standalone boundary
        run: bun run check:standalone

  package:
    name: Atet packed consumer
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: npm install --global npm@11.19.0
      - run: bun run test:package

  native:
    name: Atet macOS shell
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:desktop:macos
      - run: bun run package:desktop:macos

  required:
    name: Required
    if: always()
    needs: [plan, boundary, sdk, desktop, site, package, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          PLAN: ${{ needs.plan.result }}
          BOUNDARY: ${{ needs.boundary.result }}
          SDK: ${{ needs.sdk.result }}
          DESKTOP: ${{ needs.desktop.result }}
          SITE: ${{ needs.site.result }}
          PACKAGE: ${{ needs.package.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN" == success ]]
          [[ "$BOUNDARY" == success ]]
          for result in "$SDK" "$DESKTOP" "$SITE" "$PACKAGE" "$NATIVE"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
